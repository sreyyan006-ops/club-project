{% extends "base.html" %}
{% block title %}Log in – HP Clubs{% endblock %}
{% block content %}

<div class="center-wrap" style="margin-top:2rem;">
  <div class="card">
    <div class="card-title">Log in</div>
    <form method="POST" action="{{ url_for('login') }}">
      <div class="form-group">
        <label for="identifier">Username or Student ID</label>
        <input id="identifier" name="identifier" type="text" placeholder="Username or ID" required autofocus />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Password" required />
      </div>
      <button class="btn blue wide mt" type="submit">Log in</button>
    </form>
    <p style="text-align:center; font-size:13px; color:var(--text2); margin-top:14px;">
      No account? <a href="{{ url_for('signup') }}" style="color:var(--blue);">Sign up</a>
    </p>
  </div>
</div>

{% endblock %}
